# kind/mgmt.yaml
# Management cluster for Cluster API. The Docker provider (CAPD) creates the
# workload cluster's nodes as containers on the SAME Docker daemon, so the
# management cluster must be able to reach /var/run/docker.sock.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: capi-mgmt
nodes:
  - role: control-plane
    extraMounts:
      - hostPath: /var/run/docker.sock
        containerPath: /var/run/docker.sock
