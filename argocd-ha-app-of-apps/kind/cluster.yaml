# kind/cluster.yaml
# Argo CD HA needs three schedulable nodes: the redis-ha StatefulSet and its HAProxy
# use required pod anti-affinity on kubernetes.io/hostname, so with two workers the
# third Redis pod stays Pending forever.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: argocd-ha
nodes:
  - role: control-plane
    image: kindest/node:v1.35.0
  - role: worker
    image: kindest/node:v1.35.0
  - role: worker
    image: kindest/node:v1.35.0
  - role: worker
    image: kindest/node:v1.35.0
