# Every new Namespace gets a CiliumNetworkPolicy that denies all ingress and all egress
# except DNS. Namespaces labelled network.platform/default-deny=skip are left alone.
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: generate-default-deny
spec:
  evaluation:
    synchronize:
      enabled: true          # policy changes propagate; manual edits to the CNP are reverted
    generateExisting:
      enabled: true          # one-time pass over namespaces that already exist
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["namespaces"]
  matchConditions:
    - name: not-a-system-namespace
      expression: >-
        !(object.metadata.name in ['kube-system', 'kube-public', 'kube-node-lease',
          'kyverno', 'cilium-secrets', 'local-path-storage'])
    - name: not-opted-out
      expression: >-
        !(has(object.metadata.labels) &&
          'network.platform/default-deny' in object.metadata.labels &&
          object.metadata.labels['network.platform/default-deny'] == 'skip')
  variables:
    - name: nsName
      expression: "object.metadata.name"
    - name: downstream
      expression: >-
        [{
          "apiVersion": dyn("cilium.io/v2"),
          "kind": dyn("CiliumNetworkPolicy"),
          "metadata": dyn({
            "name": "default-deny",
            "namespace": string(variables.nsName),
            "labels": {"network.platform/managed-by": "kyverno"}
          }),
          "spec": dyn({
            "description": "Generated by Kyverno: deny all, allow DNS to kube-dns",
            "endpointSelector": {},
            "ingress": [],
            "egress": [
              {
                "toEndpoints": [
                  {"matchLabels": {"k8s:io.kubernetes.pod.namespace": "kube-system",
                                   "k8s:k8s-app": "kube-dns"}}
                ],
                "toPorts": [
                  {"ports": [{"port": "53", "protocol": "UDP"}, {"port": "53", "protocol": "TCP"}],
                   "rules": {"dns": [{"matchPattern": "*"}]}}
                ]
              }
            ]
          })
        }]
  generate:
    - expression: generator.Apply(variables.nsName, variables.downstream)
